name: PHP 8.4

on:
  push:
    branches: [ "master" ]
    paths:
      - 'php8.4/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.4.yml'
      - '.github/workflows/_build-version.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'php8.4/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.4.yml'
      - '.github/workflows/_build-version.yml'
  workflow_dispatch:

jobs:
  php84:
    uses: ./.github/workflows/_build-version.yml
    with:
      version: "8.4"
      event_type: ${{ github.event_name }}
    secrets: inherit
