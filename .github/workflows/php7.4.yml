name: PHP 7.4

on:
  push:
    branches: [ "master" ]
    paths:
      - 'php7.4/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php7.4.yml'
      - '.github/workflows/_build-version.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'php7.4/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php7.4.yml'
      - '.github/workflows/_build-version.yml'
  workflow_dispatch:

jobs:
  php74:
    uses: ./.github/workflows/_build-version.yml
    with:
      version: "7.4"
      event_type: ${{ github.event_name }}
    secrets: inherit
