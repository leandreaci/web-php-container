name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'readme.md'
      - 'RELEASE_NOTE.md'
      - 'PULL_REQUEST.md'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'readme.md'
      - 'RELEASE_NOTE.md'
      - 'PULL_REQUEST.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'PHP version to build (all, 8.5, 8.4, 8.3, 8.2, 8.1, 8.0, 7.4, 7.3)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - "8.5"
          - "8.4"
          - "8.3"
          - "8.2"
          - "8.1"
          - "8.0"
          - "7.4"
          - "7.3"

permissions:
  contents: write

jobs:
  build-and-push:
    environment: prod
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "7.3"
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.version == '' || github.event.inputs.version == 'all' || github.event.inputs.version == matrix.version }}
        uses: docker/setup-buildx-action@v3

      - name: Configure root .env from GitHub Secrets
        if: ${{ github.event.inputs.version == '' || github.event.inputs.version == 'all' || github.event.inputs.version == matrix.version }}
        env:
          SECRET_REPOSITORY: ${{ secrets.REPOSITORY }}
          SECRET_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_IMAGE: ${{ secrets.IMAGE }}
        run: |
          REPO_VAL="${SECRET_REPOSITORY:-${SECRET_DOCKERHUB_USERNAME:-renatobalbino}}"
          IMG_VAL="${SECRET_IMAGE:-php}"
          printf "REPOSITORY=%s\nIMAGE=%s\n" "$REPO_VAL" "$IMG_VAL" > .env

      - name: Build and Test PHP ${{ matrix.version }} (Pull Request)
        if: ${{ github.event_name == 'pull_request' && (github.event.inputs.version == '' || github.event.inputs.version == 'all' || github.event.inputs.version == matrix.version) }}
        run: ./tests/test-images.sh "${{ matrix.version }}"

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.version == '' || github.event.inputs.version == 'all' || github.event.inputs.version == matrix.version) }}
        uses: docker/login-action@v3
        with:
          registry: https://index.docker.io/v1/
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, Test, and Push PHP ${{ matrix.version }}
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.version == '' || github.event.inputs.version == 'all' || github.event.inputs.version == matrix.version) }}
        env:
          REPOSITORY: ${{ secrets.REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE: ${{ secrets.IMAGE }}
        run: sh build.sh "${{ matrix.version }}"
