name: PHP 8.5

on:
  push:
    branches: [ "master" ]
    paths:
      - 'php8.5/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.5.yml'
      - '.github/workflows/_build-version.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'php8.5/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.5.yml'
      - '.github/workflows/_build-version.yml'
  workflow_dispatch:

jobs:
  php85:
    uses: ./.github/workflows/_build-version.yml
    with:
      version: "8.5"
      event_type: ${{ github.event_name }}
    secrets: inherit
