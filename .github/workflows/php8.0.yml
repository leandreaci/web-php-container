name: PHP 8.0

on:
  push:
    branches: [ "master" ]
    paths:
      - 'php8.0/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.0.yml'
      - '.github/workflows/_build-version.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'php8.0/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.0.yml'
      - '.github/workflows/_build-version.yml'
  workflow_dispatch:

jobs:
  php80:
    uses: ./.github/workflows/_build-version.yml
    with:
      version: "8.0"
      event_type: ${{ github.event_name }}
    secrets: inherit
