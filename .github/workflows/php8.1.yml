name: PHP 8.1

on:
  push:
    branches: [ "master" ]
    paths:
      - 'php8.1/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.1.yml'
      - '.github/workflows/_build-version.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'php8.1/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.1.yml'
      - '.github/workflows/_build-version.yml'
  workflow_dispatch:

jobs:
  php81:
    uses: ./.github/workflows/_build-version.yml
    with:
      version: "8.1"
      event_type: ${{ github.event_name }}
    secrets: inherit
