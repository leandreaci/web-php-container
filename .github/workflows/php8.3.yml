name: PHP 8.3

on:
  push:
    branches: [ "master" ]
    paths:
      - 'php8.3/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.3.yml'
      - '.github/workflows/_build-version.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'php8.3/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/php8.3.yml'
      - '.github/workflows/_build-version.yml'
  workflow_dispatch:

jobs:
  php83:
    uses: ./.github/workflows/_build-version.yml
    with:
      version: "8.3"
      event_type: ${{ github.event_name }}
    secrets: inherit
