name: Build and Test PHP Version

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      event_type:
        required: false
        type: string
        default: 'push'

jobs:
  build:
    name: PHP ${{ inputs.version }}
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure root .env from GitHub Secrets
        env:
          SECRET_REPOSITORY: ${{ secrets.REPOSITORY }}
          SECRET_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_IMAGE: ${{ secrets.IMAGE }}
        run: |
          REPO_VAL="${SECRET_REPOSITORY:-${SECRET_DOCKERHUB_USERNAME:-renatobalbino}}"
          IMG_VAL="${SECRET_IMAGE:-php}"
          printf "REPOSITORY=%s\nIMAGE=%s\n" "$REPO_VAL" "$IMG_VAL" > .env

      - name: Build and Test PHP ${{ inputs.version }} (Pull Request)
        if: ${{ inputs.event_type == 'pull_request' }}
        run: ./tests/test-images.sh "${{ inputs.version }}"

      - name: Login to Docker Hub
        if: ${{ inputs.event_type != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: https://index.docker.io/v1/
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, Test, and Push PHP ${{ inputs.version }}
        if: ${{ inputs.event_type != 'pull_request' }}
        env:
          REPOSITORY: ${{ secrets.REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE: ${{ secrets.IMAGE }}
        run: sh build.sh "${{ inputs.version }}"
